components:
  schemas:
    AgentEffectiveSkill:
      type: object
      additionalProperties: false
      required:
        [
          skill_id,
          manifest_id,
          manifest_version,
          name,
          package_sha256,
          source,
          config,
        ]
      properties:
        skill_id:
          $ref: "./common.yaml#/components/schemas/SkillIdentifier"
        manifest_id:
          $ref: "./common.yaml#/components/schemas/SkillManifestIdentifier"
        manifest_version:
          $ref: "./common.yaml#/components/schemas/ManifestVersion"
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        package_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        source:
          type: string
          enum: [default, explicit]
        config:
          type: object
          additionalProperties: true
    AgentEffectiveResources:
      type: object
      additionalProperties: false
      required:
        [
          effective_sha256,
          skills,
          connected_apps,
          connected_app_keys,
          connectable_app_keys,
        ]
      properties:
        effective_sha256:
          type: string
          description: >-
            Deterministic digest of the effective Skill set, connected_apps and
            connected_app_keys;
            Agent Service compares it at Run boundaries.
          pattern: "^[a-f0-9]{64}$"
        connected_apps:
          type: boolean
          description: >-
            TeamHub currently has a Composio API key, from the environment or
            saved on the Apps page, so the Agent is taught and allowed the
            connected app commands.
        connected_app_keys:
          type: array
          description: >-
            Sorted keys of the apps with an account granted to this Agent, such
            as gmail or google_calendar, so its instructions name only sources
            it can query. Empty without connected_apps. Agent Service requires
            this field, so TeamHub ships before Agent Service.
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9_]+$"
        connectable_app_keys:
          type: array
          description: >-
            Sorted keys of every catalog app a Human can connect for Agents,
            such as linear, with or without a Composio key, so the Agent asks
            for authorization with teamhub apps connect instead of reaching the
            app another way. A fixed catalog, so the digest leaves it out;
            Agent Service renders it again on every Run.
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9_]+$"
        skills:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentEffectiveSkill"
