status:
  parameters:
    - name: computerId
      in: path
      required: true
      schema:
        $ref: "../components/common.yaml#/components/schemas/Id"
  get:
    tags: [Herdr Core]
    operationId: getHerdrCoreStatus
    summary: Read herdr-core daemon status and terminal counters on an owned Local Computer.
    responses:
      "200":
        description: Current herdr-core status.
        content:
          application/json:
            schema:
              $ref: "../components/herdr-core.yaml#/components/schemas/HerdrCoreStatusResponse"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../components/common.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "502":
        $ref: "../components/common.yaml#/components/responses/BadGateway"
      "503":
        $ref: "../components/common.yaml#/components/responses/ServiceUnavailable"
      "504":
        description: The Computer did not answer within the request deadline.
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/components/schemas/ErrorResponse"

terminals:
  parameters:
    - name: computerId
      in: path
      required: true
      schema:
        $ref: "../components/common.yaml#/components/schemas/Id"
  get:
    tags: [Herdr Core]
    operationId: listHerdrCoreTerminals
    summary: List herdr-core terminals on an owned Local Computer.
    parameters:
      - name: all
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: machine
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      - name: room_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      - name: work_item_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      - name: status
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
    responses:
      "200":
        description: Matching terminals and known machines.
        content:
          application/json:
            schema:
              $ref: "../components/herdr-core.yaml#/components/schemas/HerdrCoreTerminalsResponse"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../components/common.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "502":
        $ref: "../components/common.yaml#/components/responses/BadGateway"
      "503":
        $ref: "../components/common.yaml#/components/responses/ServiceUnavailable"
      "504":
        description: The Computer did not answer within the request deadline.
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/components/schemas/ErrorResponse"
  post:
    tags: [Herdr Core]
    operationId: createHerdrCoreTerminal
    summary: Start a new herdr-core terminal on an owned Local Computer or one of its remote machines.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/herdr-core.yaml#/components/schemas/HerdrCoreCreateTerminalRequest"
    responses:
      "201":
        description: Started terminal summary.
        content:
          application/json:
            schema:
              $ref: "../components/herdr-core.yaml#/components/schemas/HerdrCoreTerminalResponse"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../components/common.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
