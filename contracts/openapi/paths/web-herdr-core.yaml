terminalSend:
  parameters:
    - name: computerId
      in: path
      required: true
      schema:
        $ref: "../components/common.yaml#/components/schemas/Id"
  post:
    tags: [Herdr Core]
    operationId: sendHerdrCoreTerminalText
    summary: Send text input to one herdr-core terminal.
    description: >-
      Forwards text input to the Local Computer Daemon's herdr_core send tool.
      When if="blocked" is specified, the Daemon validates liveness, blocked
      status, and optional turn via terminal.get and invokes terminal.send with
      force: true and no "if" field, because herdr-core v0.1.21 terminal.send
      only accepts "idle" and "working" in its own "if" parameter.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/herdr-core.yaml#/components/schemas/HerdrCoreTerminalSendRequest"
    responses:
      "200":
        description: Send outcome and resulting turn.
        content:
          application/json:
            schema:
              $ref: "../components/herdr-core.yaml#/components/schemas/HerdrCoreTerminalSendResponse"
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../components/common.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "502":
        $ref: "../components/common.yaml#/components/responses/BadGateway"
      "503":
        $ref: "../components/common.yaml#/components/responses/ServiceUnavailable"
      "504":
        description: The Computer did not answer within the request deadline.
