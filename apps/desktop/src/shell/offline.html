<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src app:; form-action app:"
    />
    <title>LingerX</title>
    <style>
      :root {
        --canvas: #f6f6f6;
        --surface: #ffffff;
        --input-bg: #ffffff;
        --code-bg: #f3f3f3;
        --ink: #202020;
        --body: #404040;
        --muted: #737373;
        --border: #e5e5e5;
        --border-strong: #d4d4d4;
        --action: #202020;
        --action-hover: #303030;
        --action-ink: #ffffff;
        --secondary-hover: #f4f4f2;
        --focus-ring: rgba(32, 32, 32, 0.12);
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        --danger: #d92d20;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #161614;
          --surface: #1f1f1c;
          --input-bg: #161614;
          --code-bg: #262622;
          --ink: #f2f1ed;
          --body: #d4d3cd;
          --muted: #9c9a90;
          --border: #2e2e29;
          --border-strong: #3f3f38;
          --action: #f2f1ed;
          --action-hover: #ffffff;
          --action-ink: #161614;
          --secondary-hover: #2a2a25;
          --focus-ring: rgba(242, 241, 237, 0.22);
          --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
          --danger: #ff855f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--body);
        font:
          14px/1.55 Inter,
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(420px, 100%);
        padding: 36px 32px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .mark {
        position: relative;
        width: 52px;
        height: 52px;
        margin-bottom: 20px;
      }
      .mark img {
        width: 52px;
        height: 52px;
      }
      .mark .badge {
        position: absolute;
        right: -2px;
        bottom: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 3px solid var(--surface);
        background: #a3a3a3;
      }
      [data-mode="setup"] .badge,
      [data-mode="updating"] .badge,
      [data-mode="updating"] .actions,
      [data-mode="starting"] .badge,
      [data-mode="starting"] .actions,
      [data-mode="failed"] #edit,
      [data-mode="failed"] .countdown {
        display: none;
      }
      /* Show Logs and Save Diagnostics belong to the start failure only. */
      body:not([data-mode="failed"]) .failed-only {
        display: none;
      }
      /* Progress feedback belongs to starting and updating modes only. */
      body:not([data-mode="starting"]):not([data-mode="updating"])
        .progress-panel {
        display: none;
      }
      [hidden] {
        display: none !important;
      }
      [data-mode="failed"] #reason {
        max-height: 40vh;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }
      h1 {
        margin: 0 0 6px;
        color: var(--ink);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .host {
        color: var(--body);
        font-weight: 500;
        word-break: break-all;
      }
      .code {
        display: inline-block;
        margin-top: 14px;
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--code-bg);
        color: var(--muted);
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .code:empty {
        display: none;
      }
      .progress-panel {
        margin-top: 22px;
      }
      .progress-status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
      }
      .progress-spinner {
        flex: none;
        width: 15px;
        height: 15px;
        border: 2px solid var(--border-strong);
        border-top-color: var(--ink);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .progress-track {
        position: relative;
        height: 3px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--border);
      }
      .progress-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: var(--ink);
        animation: glide 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .slow-escape {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12.5px;
      }
      button.secondary {
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 500;
      }
      button.secondary:hover {
        background: var(--secondary-hover);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes glide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(365%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress-spinner {
          animation: none;
          width: 8px;
          height: 8px;
          border: 0;
          background: var(--ink);
        }
        .progress-bar {
          animation: none;
          left: 0;
          width: 45%;
        }
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin-top: 24px;
      }
      button,
      .link {
        height: 36px;
        white-space: nowrap;
        padding: 0 16px;
        border-radius: 8px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        border: 0;
        background: var(--action);
        color: var(--action-ink);
      }
      button.primary:hover {
        background: var(--action-hover);
      }
      .link {
        padding: 0 4px;
        border: 0;
        background: none;
        color: var(--body);
      }
      .link:hover {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .countdown {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      form {
        display: none;
        margin-top: 24px;
      }
      [data-mode="setup"] form,
      .editing form {
        display: block;
      }
      .editing .actions,
      [data-mode="setup"] .actions {
        display: none;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--body);
        font-size: 13px;
        font-weight: 500;
      }
      input {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--input-bg);
        color: var(--ink);
        font: inherit;
        outline: none;
      }
      input::placeholder {
        color: var(--muted);
      }
      input:focus {
        border-color: var(--ink);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }
      form .row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      form .row button {
        flex: none;
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
      }
      .invalid {
        color: var(--danger);
      }
      button:focus-visible,
      .link:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body data-mode="offline">
    <main>
      <div class="mark">
        <img src="app://offline/logo.png" alt="" /><span class="badge"></span>
      </div>
      <h1 id="title" data-t="unreachableTitle"></h1>
      <p id="reason"></p>
      <span class="code" id="code"></span>
      <div class="progress-panel" id="progress-panel">
        <div class="progress-status" role="status" aria-live="polite">
          <span class="progress-spinner" aria-hidden="true"></span>
          <span id="phase"></span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span class="progress-bar"></span>
        </div>
        <div class="slow-escape" id="slow-escape" hidden>
          <span id="slow-hint" data-t="takingLonger"></span>
          <button
            class="secondary"
            id="starting-logs"
            type="button"
            data-t="showLogs"
          ></button>
        </div>
      </div>
      <div class="actions">
        <button
          class="primary"
          id="retry"
          type="button"
          data-t="tryAgain"
        ></button>
        <button
          class="link"
          id="edit"
          type="button"
          data-t="changeServer"
        ></button>
        <button
          class="link failed-only"
          id="logs"
          type="button"
          data-t="showLogs"
        ></button>
        <button
          class="link failed-only"
          id="diagnostics"
          type="button"
          data-t="saveDiagnostics"
        ></button>
        <button
          class="link failed-only"
          id="send"
          type="button"
          data-t="sendDiagnostics"
          hidden
        ></button>
        <button
          class="link failed-only"
          id="reset"
          type="button"
          data-t="setUpAgain"
        ></button>
        <span class="countdown" id="countdown"></span>
      </div>
      <form action="app://offline/connect" method="get" id="form">
        <label for="server" data-t="serverAddress"></label>
        <input
          id="server"
          name="server"
          placeholder="https://lingerx.example.com"
          autocomplete="url"
          spellcheck="false"
          required
        />
        <p class="hint" id="hint" data-t="serverHint"></p>
        <div class="row">
          <button class="primary" type="submit" data-t="connect"></button>
          <button
            class="link"
            id="cancel"
            type="button"
            data-t="cancel"
          ></button>
        </div>
      </form>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const server = params.get("server") ?? "";
      const error = params.get("error") ?? "";
      const SLOW_LOGS_DELAY_MS = 15000;
      const connect = (value) => {
        location.href =
          "app://offline/connect?server=" + encodeURIComponent(value);
      };
      $("server").value = server;
      const local = ["updating", "starting", "failed"].find((mode) =>
        params.has(mode),
      );
      if (local === "updating") {
        document.body.dataset.mode = "updating";
        $("title").textContent = t("updatingTitle");
        $("reason").textContent = t("updating");
        $("phase").textContent = t("updatingPhase");
      } else if (local === "starting") {
        document.body.dataset.mode = "starting";
        $("title").textContent = t("startingTitle");
        $("reason").textContent = t("starting");
        $("phase").textContent = t("startingPhase");
      } else if (local === "failed") {
        document.body.dataset.mode = "failed";
        $("title").textContent = t("failedTitle");
        $("reason").textContent = params.get("failed");
      } else if (!server) {
        document.body.dataset.mode = "setup";
        $("title").textContent = t("setupTitle");
        $("reason").textContent = t("setup");
        // Setup, where LingerX can also be installed on this computer.
        $("cancel").textContent = t("backToSetup");
        $("server").focus();
      } else {
        $("reason").replaceChildren(
          ...tSpans("unreachable", { host: new URL(server).host }),
        );
        $("code").textContent = error;
      }
      if (local === "starting" || local === "updating") {
        setTimeout(() => {
          $("slow-escape").hidden = false;
        }, SLOW_LOGS_DELAY_MS);
      }
      // An address that is not one comes as a code, worded here; any other
      // text that is not a network error code shows as it is.
      if (error && !error.startsWith("ERR_")) {
        $("hint").textContent =
          error === "invalid-server" ? t("invalidServer") : error;
        $("hint").classList.add("invalid");
        if (server) document.body.classList.add("editing");
      }
      $("retry").addEventListener("click", () => {
        if (local === "failed") location.href = "app://offline/restart";
        else connect(server);
      });
      // Opens the log folder or saves the diagnostics zip and shows it.
      const openLogs = () => {
        location.href = "app://offline/logs";
      };
      $("logs").addEventListener("click", openLogs);
      $("starting-logs").addEventListener("click", openLogs);
      $("diagnostics").addEventListener("click", () => {
        location.href = "app://offline/diagnostics";
      });
      // Asks before sending, in a dialog of the main process.
      $("send").hidden = !params.has("send");
      $("send").addEventListener("click", () => {
        location.href = "app://offline/send";
      });
      $("edit").addEventListener("click", () => {
        document.body.classList.add("editing");
        $("server").select();
      });
      $("reset").addEventListener("click", () => {
        location.href = "app://offline/reset";
      });
      $("cancel").addEventListener("click", () => {
        if (document.body.dataset.mode === "setup")
          location.href = "app://offline/setup";
        else document.body.classList.remove("editing");
      });
      // Retry on its own while the user is not editing.
      if (server && !local) {
        let left = 15;
        const tick = () => {
          if (document.body.classList.contains("editing")) {
            $("countdown").textContent = "";
            return;
          }
          left -= 1;
          if (left <= 0) return connect(server);
          $("countdown").textContent = t("retrying", { seconds: left });
        };
        tick();
        setInterval(tick, 1000);
      }
    </script>
  </body>
</html>
