<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title data-t="pageTitle"></title>
    <style>
      :root {
        --canvas: #ffffff;
        --surface: #ffffff;
        --ink: #202020;
        --body: #404040;
        --muted: #737373;
        --border: #d4d4d4;
        --focus: #202020;
        --focus-ring: rgba(32, 32, 32, 0.14);
        --action: #202020;
        --action-hover: #333333;
        --action-ink: #ffffff;
        --ok: #2f9e44;
        --error: #b5320a;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #161614;
          --surface: #1f1f1c;
          --ink: #f2f1ed;
          --body: #d4d3cd;
          --muted: #9c9a90;
          --border: #35352f;
          --focus: #f2f1ed;
          --focus-ring: rgba(242, 241, 237, 0.22);
          --action: #f2f1ed;
          --action-hover: #ffffff;
          --action-ink: #161614;
          --ok: #6ee787;
          --error: #ff855f;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        padding: 16px;
        background: var(--canvas);
        color: var(--body);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 10px;
      }
      label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      textarea {
        flex: 1;
        min-height: 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        resize: none;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }
      textarea::placeholder {
        color: var(--muted);
      }
      textarea:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 28px;
      }
      #status {
        flex: 1;
        margin: 0;
        font-size: 12px;
      }
      #status[data-tone="ok"] {
        color: var(--ok);
      }
      #status[data-tone="error"] {
        color: var(--error);
      }
      #status[data-tone="muted"] {
        color: var(--muted);
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      button {
        padding: 6px 14px;
        border: 0;
        border-radius: 7px;
        background: var(--action);
        color: var(--action-ink);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--action-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <label for="note" data-t="label"></label>
      <textarea
        id="note"
        autofocus
        spellcheck="true"
        data-t-placeholder="placeholder"
      ></textarea>
      <div class="footer">
        <p id="status" role="status" aria-live="polite"></p>
        <span class="hint" data-t="shortcutHint"></span>
        <button id="save" type="button" data-t="save"></button>
      </div>
    </main>
    <script>
      const note = document.getElementById("note");
      const status = document.getElementById("status");
      const save = document.getElementById("save");
      let busy = false;

      const show = (text, tone) => {
        status.textContent = text;
        status.dataset.tone = tone;
      };

      const setBusy = (value) => {
        busy = value;
        save.disabled = value;
      };

      const submit = async () => {
        if (busy) return;
        const text = note.value.trim();
        if (!text) {
          show(t("empty"), "error");
          note.focus();
          return;
        }
        setBusy(true);
        show(t("saving"), "muted");
        try {
          const result = await window.lingerQuickNote.submit(text);
          if (result.ok) {
            note.value = "";
            show(t("saved"), "ok");
            return;
          }
          show(result.message, "error");
        } catch {
          show(t("saveFailed"), "error");
        } finally {
          setBusy(false);
          note.focus();
        }
      };

      note.addEventListener("input", () => {
        if (status.textContent) show("", "muted");
      });
      save.addEventListener("click", () => void submit());
      document.addEventListener("keydown", (event) => {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
          event.preventDefault();
          void submit();
        } else if (event.key === "Escape" && !busy) {
          event.preventDefault();
          window.lingerQuickNote.cancel();
        }
      });
      note.focus();
    </script>
  </body>
</html>
