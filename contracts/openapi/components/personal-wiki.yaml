components:
  schemas:
    PersonalWikiState:
      type: string
      description: refreshing while a refresh runs or its follow-up is queued; failed when the latest refresh failed or conflicted.
      enum: [idle, refreshing, failed]
    PersonalWikiRefreshOutcome:
      type: string
      description: >-
        accepted when the refresh was admitted and runs now; already_latest when every source is
        already in the published Wiki; in_progress when a refresh is already running; no_sources
        when the Wiki has no source to refresh from yet.
      enum: [accepted, already_latest, in_progress, no_sources]
    PersonalWikiRefresh:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          $ref: "#/components/schemas/PersonalWikiRefreshOutcome"
    PersonalWikiRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: >-
            The business date the refresh is for. It scopes the request's idempotency, not the
            sources; omit it for the current date.
    PersonalWikiFailureReason:
      type: string
      description: >-
        Actionable cause of the latest failed refresh when known: computer_offline,
        runtime_incompatible, runtime_auth_required, or runtime_unavailable.
      enum:
        - computer_offline
        - runtime_incompatible
        - runtime_auth_required
        - runtime_unavailable
    PersonalWiki:
      type: object
      additionalProperties: false
      required: [tenant_id, owner_actor_id, published_generation, state]
      properties:
        id:
          description: Absent until a write (binding or uploading a source, a refresh request from Memory) creates the Wiki root.
          $ref: "./common.yaml#/components/schemas/Id"
        tenant_id:
          $ref: "./common.yaml#/components/schemas/Id"
        owner_actor_id:
          $ref: "./common.yaml#/components/schemas/Id"
        published_generation:
          type: integer
          format: int64
          minimum: 0
          description: Advances by one with each published Revision.
        state:
          $ref: "#/components/schemas/PersonalWikiState"
        failure_reason:
          description: Present when state is failed and the refresh failed for an actionable Computer or Runtime cause.
          $ref: "#/components/schemas/PersonalWikiFailureReason"
        preview_revision:
          type: integer
          format: int64
          description: Advances when the active refresh has a new three-minute preview.
        latest_refresh_id:
          description: The latest refresh; a client that saw an earlier failure can tell a new one apart.
          $ref: "./common.yaml#/components/schemas/Id"
        current_revision_id:
          $ref: "./common.yaml#/components/schemas/Id"
        created_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        updated_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
