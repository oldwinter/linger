name: Desktop release

# Pushing a desktop-v<version> tag builds the macOS (Apple silicon), Linux x64
# and Windows x64 packages and uploads them, with SHA256SUMS.txt, to the
# GitHub Release of that tag in RELEASE_REPO (simplexai-labs/linger unless the
# variable says otherwise). Stable tags create a draft release so release notes
# are attached before notifying subscribers or updating releases/latest
# (`scripts/ci/desktop-release.sh publish`); versions with a hyphen publish
# immediately as prereleases. A manual run builds a version from the chosen
# branch and keeps the files as workflow artifacts unless "publish" is set.
# scripts/ci/desktop-release.sh does the work; docs/desktop-release.md lists
# the variables and secrets. This is the only workflow that publishes desktop
# releases.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, such as 0.16.33 or 0.16.33-rc.1
        required: true
      publish:
        description: Also create the desktop-v<version> release at this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  # owner/name of the repository that receives the release.
  RELEASE_REPO: ${{ vars.RELEASE_REPO || 'simplexai-labs/linger' }}
  # https folder serving the PostgreSQL and voice tools archives that
  # apps/desktop/distribution/*.json pin: the assets of the native-deps
  # prerelease, unless a secret or variable names another folder.
  LINGER_NATIVE_DEPS_URL: ${{ secrets.LINGER_NATIVE_DEPS_URL || vars.LINGER_NATIVE_DEPS_URL || 'https://github.com/simplexai-labs/linger/releases/download/native-deps' }}
  # rcodesign reads RCODESIGN_* variables as its configuration, so these
  # carry another prefix.
  APPLE_CODESIGN_VERSION: 0.29.0
  APPLE_CODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        env:
          INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          HAS_RELEASE_TOKEN: ${{ secrets.LINGER_RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          scripts/ci/desktop-release.sh version "$INPUT" | tee -a "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >>"$GITHUB_OUTPUT"
          # Stop before an hour of building when the release could not be published.
          if [ "$PUBLISH" = true ] && [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ] && [ "$HAS_RELEASE_TOKEN" != true ]; then
            echo "::error::Publishing to $RELEASE_REPO from $GITHUB_REPOSITORY needs the LINGER_RELEASE_TOKEN secret, a token with contents write access to $RELEASE_REPO (see docs/desktop-release.md)."
            exit 1
          fi
          echo "Release repository: $RELEASE_REPO"

  build:
    needs: prepare
    # The packaging scripts build the DMG and the Windows installer on Linux
    # with Docker, which the macOS and Windows runners do not offer.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, linux-x64, win32-x64]
        # The file a tester downloads and runs, uploaded on its own below.
        include:
          - target: darwin-arm64
            installer: macos-arm64.dmg
            docker_image: dmgtool
            docker_file: apps/desktop/packaging/mac/Dockerfile
          - target: linux-x64
            installer: linux-x64.tar.gz
            docker_image: ""
            docker_file: ""
          - target: win32-x64
            installer: windows-x64-setup.exe
            docker_image: wintool
            docker_file: apps/desktop/packaging/win/Dockerfile
    env:
      DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_OUT: ${{ github.workspace }}/.linger-runtime/desktop-release
      LINGER_NATIVE_POSTGRES_DIR: ${{ github.workspace }}/.linger-runtime/native-deps
    steps:
      # A target's build holds the bundled runtime, its archive and the
      # package at once; the runner image's SDKs leave too little room.
      - name: Free disk space
        run: >-
          sudo bash -c
          'rm -rf /usr/share/dotnet & rm -rf /usr/local/lib/android & rm -rf /opt/ghc & rm -rf /opt/hostedtoolcache/CodeQL & wait'
      - uses: actions/checkout@v7
      - id: versions
        shell: bash
        run: |
          echo "node=$(tr -d '[:space:]' <.node-version)" >>"$GITHUB_OUTPUT"
          go_ver=$(sed -n 's/^toolchain go//p' apps/teamhub/go.mod | head -n 1)
          [ -n "$go_ver" ] || go_ver=$(sed -n 's/^go //p' apps/teamhub/go.mod | head -n 1)
          echo "go=$go_ver" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.versions.outputs.node }}
          key: toolcache-node-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.versions.outputs.go }}
          key: toolcache-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.go }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Cache GOMODCACHE once across targets and GOCACHE per target so cross-
      # compiled stdlib and TeamHub packages stay warm for darwin-arm64 and win32-x64.
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/teamhub/go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: desktop-gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/teamhub/go.sum', 'apps/computer/local-daemon/go.sum', 'contracts/generated/go/go.sum') }}
          restore-keys: desktop-gomod-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: desktop-gobuild-${{ matrix.target }}-${{ steps.versions.outputs.go }}-${{ hashFiles('apps/teamhub/go.sum', 'apps/computer/local-daemon/go.sum', 'contracts/generated/go/go.sum') }}
          restore-keys: desktop-gobuild-${{ matrix.target }}-${{ steps.versions.outputs.go }}-
      - run: pnpm install --frozen-lockfile
      # Pinned binary downloads reused across releases: Electron, Cua driver,
      # native PostgreSQL + voice tools, and the pinned Node.js distribution.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/linger-desktop
            ~/.cache/linger-computer-tools
            ${{ env.LINGER_NATIVE_POSTGRES_DIR }}
            .linger-runtime/node-distributions
          key: desktop-downloads-${{ matrix.target }}-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/distribution/*.json', 'scripts/local-computer-node-distributions.mjs', 'apps/computer/scripts/bundle-computer-tools.mjs') }}
          restore-keys: desktop-downloads-${{ matrix.target }}-
      - id: docker-cache
        if: matrix.docker_image != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/linger-docker/${{ matrix.docker_image }}.tar
          key: desktop-docker-${{ matrix.docker_image }}-${{ hashFiles(matrix.docker_file) }}
      - name: Load cached Docker image
        if: matrix.docker_image != '' && steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/.cache/linger-docker/${{ matrix.docker_image }}.tar
      - name: Install rcodesign
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          set -euo pipefail
          name="apple-codesign-$APPLE_CODESIGN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$APPLE_CODESIGN_VERSION/$name.tar.gz"
          echo "$APPLE_CODESIGN_SHA256  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/$name/rcodesign" >>"$GITHUB_ENV"
      - name: Install osslsigncode
        if: matrix.target == 'win32-x64'
        env:
          WINDOWS_SIGNING_P12_BASE64: ${{ secrets.WINDOWS_SIGNING_P12_BASE64 }}
        run: |
          if [ -z "$WINDOWS_SIGNING_P12_BASE64" ]; then
            echo "Skipping osslsigncode install: WINDOWS_SIGNING_P12_BASE64 is not set."
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q osslsigncode
      # Optional signing material goes to files only rcodesign, openssl and
      # osslsigncode read; each is skipped when its secret is empty.
      - name: Write signing files
        shell: bash
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          MACOS_NOTARY_KEY_JSON: ${{ secrets.MACOS_NOTARY_KEY_JSON }}
          WINDOWS_SIGNING_P12_BASE64: ${{ secrets.WINDOWS_SIGNING_P12_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 077
          keys="$RUNNER_TEMP/signing"
          mkdir -p "$keys"
          if [ "$TARGET" = darwin-arm64 ] && [ -n "$MACOS_DEVELOPER_ID_P12_BASE64" ]; then
            base64 -d <<<"$MACOS_DEVELOPER_ID_P12_BASE64" >"$keys/developer-id.p12"
            printf '%s' "$MACOS_DEVELOPER_ID_PASSWORD" >"$keys/developer-id.password"
            echo "MACOS_DEVELOPER_ID_P12=$keys/developer-id.p12" >>"$GITHUB_ENV"
            echo "MACOS_DEVELOPER_ID_PASSWORD_FILE=$keys/developer-id.password" >>"$GITHUB_ENV"
            if [ -n "$MACOS_NOTARY_KEY_JSON" ]; then
              printf '%s' "$MACOS_NOTARY_KEY_JSON" >"$keys/notary.json"
              echo "MACOS_NOTARY_KEY=$keys/notary.json" >>"$GITHUB_ENV"
            fi
          fi
          if [ "$TARGET" = win32-x64 ] && [ -n "$WINDOWS_SIGNING_P12_BASE64" ]; then
            base64 -d <<<"$WINDOWS_SIGNING_P12_BASE64" >"$keys/authenticode.p12"
            printf '%s' "$WINDOWS_SIGNING_PASSWORD" >"$keys/authenticode.password"
            echo "WINDOWS_SIGNING_P12=$keys/authenticode.p12" >>"$GITHUB_ENV"
            echo "WINDOWS_SIGNING_PASSWORD_FILE=$keys/authenticode.password" >>"$GITHUB_ENV"
          fi
      - run: scripts/ci/desktop-release.sh build ${{ matrix.target }}
        env:
          # The hosted diagnostics receiver this build carries; a secret so
          # the address stays masked. Without it Send Diagnostics is hidden.
          LINGER_DIAGNOSTICS_UPLOAD_URL: ${{ secrets.LINGER_DIAGNOSTICS_UPLOAD_URL }}
      - name: Record Windows Setup digest
        if: matrix.target == 'win32-x64'
        shell: bash
        run: |
          cd "$RELEASE_OUT/assets"
          sha256sum "Linger-$DESKTOP_VERSION-windows-x64-setup.exe" > windows-setup.sha256
      - name: Save Docker image for cache
        if: matrix.docker_image != '' && steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/linger-docker
          docker save -o ~/.cache/linger-docker/${{ matrix.docker_image }}.tar ${{ matrix.docker_image }}
      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v7
        if: matrix.target != 'win32-x64'
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ env.RELEASE_OUT }}/assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'win32-x64'
        with:
          name: desktop-win32-x64
          path: |
            ${{ env.RELEASE_OUT }}/assets/Linger-${{ env.DESKTOP_VERSION }}-windows-x64-setup.exe
            ${{ env.RELEASE_OUT }}/assets/windows-setup.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'win32-x64'
        with:
          name: desktop-win32-x64-portable
          path: ${{ env.RELEASE_OUT }}/assets/Linger-${{ env.DESKTOP_VERSION }}-windows-x64-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      # The installer again on its own, not zipped, so a tester downloads
      # only the file they run instead of every package for the platform.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASE_OUT }}/assets/Linger-${{ env.DESKTOP_VERSION }}-${{ matrix.installer }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    needs: [prepare, build]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: desktop-win32-x64
          path: candidate
      - name: Smoke the packaged Pi runtime with its managed MCP extension
        shell: powershell
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $setup = "candidate\Linger-$env:DESKTOP_VERSION-windows-x64-setup.exe"
          $digest = (Get-Content -LiteralPath 'candidate\windows-setup.sha256' -Raw).Split(' ')[0]
          scripts/ci/windows-desktop-smoke.ps1 -Setup $setup -ExpectedSha256 $digest

  release:
    needs: [prepare, build, windows-smoke]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Verify the Windows Setup that passed smoke
        working-directory: release
        run: sha256sum -c windows-setup.sha256 && rm windows-setup.sha256
      # The signed update manifest over every platform's package. Without
      # the key the release still goes out, with a warning and no manifest.
      - name: Sign the update manifest
        env:
          DESKTOP_UPDATE_KEY_PEM: ${{ secrets.DESKTOP_UPDATE_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$DESKTOP_UPDATE_KEY_PEM" ]; then
            key="$RUNNER_TEMP/update.pem"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$DESKTOP_UPDATE_KEY_PEM" >"$key"
            export DESKTOP_UPDATE_KEY="$key"
          fi
          scripts/ci/desktop-release.sh manifest release "${{ needs.prepare.outputs.version }}"
      - run: scripts/ci/desktop-release.sh checksums release "${{ needs.prepare.outputs.version }}"
      # GITHUB_TOKEN can write only this repository; a release in another one
      # takes LINGER_RELEASE_TOKEN, which prepare checked.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ env.RELEASE_REPO == github.repository && github.token || secrets.LINGER_RELEASE_TOKEN }}
        run: >-
          scripts/ci/desktop-release.sh github-release release
          "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.version }}"
