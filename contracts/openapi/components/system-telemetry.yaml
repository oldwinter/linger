components:
  responses:
    SystemTelemetryRefused:
      description: >-
        The Computer or TeamHub could not serve system telemetry; error.code is
        one of SystemTelemetryErrorCode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SystemTelemetryErrorResponse"
  schemas:
    SystemTelemetryArchitecture:
      description: Host memory architecture class.
      type: string
      enum: [uma, discrete]
      x-enum-varnames:
        [SystemTelemetryArchitectureUma, SystemTelemetryArchitectureDiscrete]
    SystemTelemetryPlatform:
      type: string
      enum: [darwin, linux, windows]
      x-enum-varnames:
        [
          SystemTelemetryPlatformDarwin,
          SystemTelemetryPlatformLinux,
          SystemTelemetryPlatformWindows,
        ]
    SystemTelemetryArch:
      type: string
      enum: [x86_64, arm64]
      x-enum-varnames: [SystemTelemetryArchX8664, SystemTelemetryArchArm64]
    SystemTelemetryMemoryPressure:
      type: string
      enum: [normal, warning, critical]
      x-enum-varnames:
        [
          SystemTelemetryMemoryPressureNormal,
          SystemTelemetryMemoryPressureWarning,
          SystemTelemetryMemoryPressureCritical,
        ]
    SystemTelemetryBandwidthSource:
      description: >-
        Provenance of memory bandwidth telemetry. estimated means effective
        decode bandwidth is derived from active model weight footprint
        multiplied by live decode tokens/s; spec means the hardware theoretical
        peak bandwidth is known while no model is actively decoding; unavailable
        means neither effective nor theoretical peak bandwidth is known.
      type: string
      enum: [estimated, spec, unavailable]
      x-enum-varnames:
        [
          SystemTelemetryBandwidthSourceEstimated,
          SystemTelemetryBandwidthSourceSpec,
          SystemTelemetryBandwidthSourceUnavailable,
        ]
    SystemTelemetryCpuClusterKind:
      type: string
      enum: [super, performance, efficiency, generic]
      x-enum-varnames:
        [
          SystemTelemetryCpuClusterKindSuper,
          SystemTelemetryCpuClusterKindPerformance,
          SystemTelemetryCpuClusterKindEfficiency,
          SystemTelemetryCpuClusterKindGeneric,
        ]
    SystemTelemetryThermalState:
      type: string
      enum: [nominal, fair, serious, critical]
      x-enum-varnames:
        [
          SystemTelemetryThermalStateNominal,
          SystemTelemetryThermalStateFair,
          SystemTelemetryThermalStateSerious,
          SystemTelemetryThermalStateCritical,
        ]
    SystemTelemetryModelEngine:
      type: string
      enum: [llama.cpp, polystrata, strata, mlx, other]
      x-enum-varnames:
        [
          SystemTelemetryModelEngineLlamaCpp,
          SystemTelemetryModelEnginePolystrata,
          SystemTelemetryModelEngineStrata,
          SystemTelemetryModelEngineMlx,
          SystemTelemetryModelEngineOther,
        ]
    SystemTelemetryModelStatus:
      type: string
      enum: [serving, prefilling, decoding, idle]
      x-enum-varnames:
        [
          SystemTelemetryModelStatusServing,
          SystemTelemetryModelStatusPrefilling,
          SystemTelemetryModelStatusDecoding,
          SystemTelemetryModelStatusIdle,
        ]
    SystemTelemetryRequestStage:
      type: string
      enum: [queued, prefilling, decoding, completed]
      x-enum-varnames:
        [
          SystemTelemetryRequestStageQueued,
          SystemTelemetryRequestStagePrefilling,
          SystemTelemetryRequestStageDecoding,
          SystemTelemetryRequestStageCompleted,
        ]
    SystemTelemetryBottleneckKind:
      type: string
      enum:
        - idle
        - healthy
        - memory_bw_bound
        - kv_cache_bound
        - vram_pressure
        - thermal_throttled
        - prefill_compute_bound
      x-enum-varnames:
        - SystemTelemetryBottleneckIdle
        - SystemTelemetryBottleneckHealthy
        - SystemTelemetryBottleneckMemoryBwBound
        - SystemTelemetryBottleneckKvCacheBound
        - SystemTelemetryBottleneckVramPressure
        - SystemTelemetryBottleneckThermalThrottled
        - SystemTelemetryBottleneckPrefillComputeBound
    SystemTelemetryBottleneckSeverity:
      type: string
      enum: [healthy, info, warning, critical]
      x-enum-varnames:
        [
          SystemTelemetryBottleneckSeverityHealthy,
          SystemTelemetryBottleneckSeverityInfo,
          SystemTelemetryBottleneckSeverityWarning,
          SystemTelemetryBottleneckSeverityCritical,
        ]
    SystemTelemetryCpuCluster:
      type: object
      additionalProperties: false
      required: [id, name, kind, cores]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/SystemTelemetryCpuClusterKind"
        cores:
          type: integer
          minimum: 1
          maximum: 1024
        load_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        freq_ghz:
          type: number
          minimum: 0
          nullable: true
    SystemTelemetryMemory:
      type: object
      additionalProperties: false
      required:
        [
          total_bytes,
          used_bytes,
          model_weights_bytes,
          kv_cache_bytes,
          compute_buffer_bytes,
          active_apps_bytes,
          free_headroom_bytes,
          system_ram_total_bytes,
          system_ram_used_bytes,
          system_ram_available_bytes,
        ]
      properties:
        total_bytes:
          type: integer
          format: int64
          minimum: 0
        used_bytes:
          type: integer
          format: int64
          minimum: 0
        recommended_working_set_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        model_weights_bytes:
          type: integer
          format: int64
          minimum: 0
        kv_cache_bytes:
          type: integer
          format: int64
          minimum: 0
        compute_buffer_bytes:
          type: integer
          format: int64
          minimum: 0
        os_wired_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        active_apps_bytes:
          type: integer
          format: int64
          minimum: 0
        compressed_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        free_headroom_bytes:
          type: integer
          format: int64
          minimum: 0
        vram_total_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        vram_used_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        vram_free_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        system_ram_total_bytes:
          type: integer
          format: int64
          minimum: 0
        system_ram_used_bytes:
          type: integer
          format: int64
          minimum: 0
        system_ram_available_bytes:
          type: integer
          format: int64
          minimum: 0
        memory_pressure:
          allOf:
            - $ref: "#/components/schemas/SystemTelemetryMemoryPressure"
          nullable: true
        swap_used_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        swap_total_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        swap_io_mb_s:
          type: number
          minimum: 0
          nullable: true
    SystemTelemetryBandwidth:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        effective_decode_gb_s:
          type: number
          minimum: 0
          nullable: true
        theoretical_gb_s:
          type: number
          minimum: 0
          nullable: true
        utilization_pct:
          type: number
          minimum: 0
          nullable: true
        source:
          $ref: "#/components/schemas/SystemTelemetryBandwidthSource"
    SystemTelemetryDisk:
      type: object
      additionalProperties: false
      properties:
        total_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        free_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        model_cache_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        read_mb_s:
          type: number
          minimum: 0
          nullable: true
        write_mb_s:
          type: number
          minimum: 0
          nullable: true
    SystemTelemetryCpu:
      type: object
      additionalProperties: false
      required: [total_cores, clusters]
      properties:
        total_cores:
          type: integer
          minimum: 0
          maximum: 4096
        logical_threads:
          type: integer
          minimum: 0
          maximum: 4096
          nullable: true
        load_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        load_avg:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
        clusters:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/SystemTelemetryCpuCluster"
    SystemTelemetryGpu:
      type: object
      additionalProperties: false
      properties:
        util_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        renderer_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        tiler_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        alloc_system_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        in_use_system_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        freq_mhz:
          type: number
          minimum: 0
          nullable: true
        max_freq_mhz:
          type: number
          minimum: 0
          nullable: true
        ane_util_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
    SystemTelemetryPower:
      type: object
      additionalProperties: false
      properties:
        package_w:
          type: number
          minimum: 0
          nullable: true
        limit_w:
          type: number
          minimum: 0
          nullable: true
        cpu_w:
          type: number
          minimum: 0
          nullable: true
        gpu_w:
          type: number
          minimum: 0
          nullable: true
        ane_w:
          type: number
          minimum: 0
          nullable: true
    SystemTelemetryThermal:
      type: object
      additionalProperties: false
      required: [throttling]
      properties:
        soc_temp_c:
          type: number
          nullable: true
        gpu_temp_c:
          type: number
          nullable: true
        throttle_temp_c:
          type: number
          nullable: true
        state:
          allOf:
            - $ref: "#/components/schemas/SystemTelemetryThermalState"
          nullable: true
        throttling:
          type: boolean
        cpu_speed_limit_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        throttle_reason:
          type: string
          maxLength: 200
          nullable: true
        fan_rpm:
          type: number
          minimum: 0
          nullable: true
        fan_max_rpm:
          type: number
          minimum: 0
          nullable: true
        fan_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
    SystemTelemetryHardware:
      type: object
      additionalProperties: false
      required:
        [
          architecture,
          platform,
          arch,
          hostname,
          chip_name,
          os_label,
          memory,
          bandwidth,
          disk,
          cpu,
          gpu,
          power,
          thermal,
        ]
      properties:
        architecture:
          $ref: "#/components/schemas/SystemTelemetryArchitecture"
        platform:
          $ref: "#/components/schemas/SystemTelemetryPlatform"
        arch:
          $ref: "#/components/schemas/SystemTelemetryArch"
        hostname:
          type: string
          maxLength: 200
        chip_name:
          type: string
          maxLength: 200
        os_label:
          type: string
          maxLength: 200
        gpu_name:
          type: string
          maxLength: 200
          nullable: true
        gpu_core_count:
          type: integer
          minimum: 0
          maximum: 4096
          nullable: true
        ane_cores:
          type: integer
          minimum: 0
          maximum: 256
          nullable: true
        memory:
          $ref: "#/components/schemas/SystemTelemetryMemory"
        bandwidth:
          $ref: "#/components/schemas/SystemTelemetryBandwidth"
        disk:
          $ref: "#/components/schemas/SystemTelemetryDisk"
        cpu:
          $ref: "#/components/schemas/SystemTelemetryCpu"
        gpu:
          $ref: "#/components/schemas/SystemTelemetryGpu"
        power:
          $ref: "#/components/schemas/SystemTelemetryPower"
        thermal:
          $ref: "#/components/schemas/SystemTelemetryThermal"
    SystemTelemetryLoadedModel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          engine,
          quant,
          vram_bytes,
          context_window,
          slots,
          active_slots,
          status,
        ]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
        name:
          type: string
          minLength: 1
          maxLength: 200
        engine:
          $ref: "#/components/schemas/SystemTelemetryModelEngine"
        quant:
          type: string
          maxLength: 64
        vram_bytes:
          type: integer
          format: int64
          minimum: 0
        kv_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        ram_bytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        context_window:
          type: integer
          format: int64
          minimum: 0
        slots:
          type: integer
          minimum: 0
          maximum: 256
        active_slots:
          type: integer
          minimum: 0
          maximum: 256
        keep_alive_remaining_sec:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        status:
          $ref: "#/components/schemas/SystemTelemetryModelStatus"
        warm_decode_tok_s:
          type: number
          minimum: 0
          nullable: true
        warm_prefill_tok_s:
          type: number
          minimum: 0
          nullable: true
    SystemTelemetrySlot:
      description: >-
        Numeric occupancy metadata for one inference server slot. Prompt and
        completion text are stripped at the collector boundary.
      type: object
      additionalProperties: false
      required: [id, model_id, busy]
      properties:
        id:
          type: integer
          minimum: 0
          maximum: 256
        model_id:
          type: string
          minLength: 1
          maxLength: 160
        busy:
          type: boolean
        n_ctx:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        prompt_tokens:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        prompt_processed:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        cached_prompt_tokens:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        decoded_tokens:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        live_decode_tok_s:
          type: number
          minimum: 0
          nullable: true
        client:
          type: string
          maxLength: 120
          nullable: true
    SystemTelemetryRequest:
      description: >-
        Privacy-stripped timing and token metadata for one in-flight or recent
        local inference call. No prompt or completion text is ever recorded.
      type: object
      additionalProperties: false
      required:
        [
          id,
          client,
          model_id,
          model_name,
          stage,
          prompt_tokens,
          prompt_processed,
          cached_prompt_tokens,
          decoded_tokens,
          gateway_ms,
          prefill_ms,
          decode_ms,
          started_at_ms,
        ]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        client:
          type: string
          minLength: 1
          maxLength: 120
        model_id:
          type: string
          minLength: 1
          maxLength: 160
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        stage:
          $ref: "#/components/schemas/SystemTelemetryRequestStage"
        slot_id:
          type: integer
          minimum: 0
          maximum: 256
          nullable: true
        prompt_tokens:
          type: integer
          format: int64
          minimum: 0
        prompt_processed:
          type: integer
          format: int64
          minimum: 0
        cached_prompt_tokens:
          type: integer
          format: int64
          minimum: 0
        decoded_tokens:
          type: integer
          format: int64
          minimum: 0
        ttft_ms:
          type: number
          minimum: 0
          nullable: true
        gateway_ms:
          type: number
          minimum: 0
        prefill_ms:
          type: number
          minimum: 0
        decode_ms:
          type: number
          minimum: 0
        live_decode_tok_s:
          type: number
          minimum: 0
          nullable: true
        context_used_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        started_at_ms:
          type: integer
          format: int64
          minimum: 0
        completed_at_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    SystemTelemetryBottleneck:
      type: object
      additionalProperties: false
      required: [kind, severity, reason_code]
      properties:
        kind:
          $ref: "#/components/schemas/SystemTelemetryBottleneckKind"
        severity:
          $ref: "#/components/schemas/SystemTelemetryBottleneckSeverity"
        dominant_factor_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
    SystemTelemetryInference:
      type: object
      additionalProperties: false
      required:
        [
          prefill_tok_s,
          decode_tok_s,
          active_requests_count,
          queued_requests_count,
          active_slots,
          total_slots,
          kv_cache_tokens_used,
          kv_cache_tokens_capacity,
          total_tokens_session,
          loaded_models,
          slots,
          requests,
          bottleneck,
        ]
      properties:
        ttft_live_ms:
          type: number
          minimum: 0
          nullable: true
        ttft_p50_ms:
          type: number
          minimum: 0
          nullable: true
        ttft_p95_ms:
          type: number
          minimum: 0
          nullable: true
        prefill_tok_s:
          type: number
          minimum: 0
        decode_tok_s:
          type: number
          minimum: 0
        theoretical_decode_ceiling_tok_s:
          type: number
          minimum: 0
          nullable: true
        bandwidth_efficiency_pct:
          type: number
          minimum: 0
          nullable: true
        active_requests_count:
          type: integer
          minimum: 0
        queued_requests_count:
          type: integer
          minimum: 0
        active_slots:
          type: integer
          minimum: 0
        total_slots:
          type: integer
          minimum: 0
        kv_cache_used_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        kv_cache_tokens_used:
          type: integer
          format: int64
          minimum: 0
        kv_cache_tokens_capacity:
          type: integer
          format: int64
          minimum: 0
        prefix_cache_hit_rate_pct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        total_tokens_session:
          type: integer
          format: int64
          minimum: 0
        loaded_models:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/SystemTelemetryLoadedModel"
        slots:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/SystemTelemetrySlot"
        requests:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/SystemTelemetryRequest"
        bottleneck:
          $ref: "#/components/schemas/SystemTelemetryBottleneck"
    SystemTelemetrySnapshot:
      description: >-
        Point-in-time rootless hardware and local LLM inference telemetry
        sampled by a Local Computer Daemon.
      type: object
      additionalProperties: false
      required: [observed_at, hardware, inference]
      properties:
        observed_at:
          $ref: "./common.yaml#/components/schemas/Timestamp"
        sample_interval_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        hardware:
          $ref: "#/components/schemas/SystemTelemetryHardware"
        inference:
          $ref: "#/components/schemas/SystemTelemetryInference"
    SystemTelemetryView:
      description: >-
        Live hardware and LLM inference telemetry view of one Local Computer as
        presented in Settings > System.
      type: object
      additionalProperties: false
      required: [computer_id, display_name, viewer_is_owner, online, supported]
      properties:
        computer_id:
          $ref: "./common.yaml#/components/schemas/Id"
        display_name:
          type: string
          maxLength: 200
        viewer_is_owner:
          type: boolean
        online:
          type: boolean
        supported:
          description: False when the connected Local Computer Daemon predates live system telemetry.
          type: boolean
        telemetry:
          allOf:
            - $ref: "#/components/schemas/SystemTelemetrySnapshot"
          nullable: true
    SystemTelemetryErrorCode:
      type: string
      enum:
        - LOCAL_COMPUTER_OFFLINE
        - SYSTEM_TELEMETRY_UNSUPPORTED
        - SYSTEM_TELEMETRY_FAILED
        - SYSTEM_TELEMETRY_TIMEOUT
        - SYSTEM_TELEMETRY_SERVICE_UNAVAILABLE
      x-enum-varnames:
        - SystemTelemetryErrorCodeLocalComputerOffline
        - SystemTelemetryErrorCodeUnsupported
        - SystemTelemetryErrorCodeFailed
        - SystemTelemetryErrorCodeTimeout
        - SystemTelemetryErrorCodeServiceUnavailable
    SystemTelemetryError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/SystemTelemetryErrorCode"
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/ErrorDetail"
    SystemTelemetryErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/SystemTelemetryError"
