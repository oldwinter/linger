attach:
  parameters:
    - name: computerId
      in: path
      required: true
      schema:
        $ref: "../components/common.yaml#/components/schemas/Id"
  get:
    tags: [Herdr Core]
    operationId: attachHerdrCoreTerminal
    summary: Upgrade to a binary PTY WebSocket attached to one herdr-core terminal.
    description: >-
      Authenticates the owner session, mints a short-lived signed attach token,
      and bridges the WebSocket to Node Services' independent binary PTY relay
      (/v1/herdr-core/attach). Binary frames carry raw PTY bytes; text frames
      carry JSON control messages (resize, mode, put, ping / attached, resize,
      status, put_result, closed, error, pong). While observe is true, client
      binary input and resize frames are rejected server-side.
    parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: cols
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 120
      - name: rows
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 36
      - name: observe
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: history
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 200
      - name: resumed
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      "101":
        description: Switching Protocols to the binary PTY attach WebSocket.
      "400":
        $ref: "../components/common.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/common.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../components/common.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../components/common.yaml#/components/responses/NotFound"
      "409":
        $ref: "../components/common.yaml#/components/responses/Conflict"
      "502":
        $ref: "../components/common.yaml#/components/responses/BadGateway"
      "503":
        $ref: "../components/common.yaml#/components/responses/ServiceUnavailable"
