ask:
  post:
    operationId: askAgentHerdrCoreTerminal
    tags: [Agent Business API]
    security: [{ agentBearer: [] }]
    summary: Ask the owner of this AnotherMe's Local Computer how to answer a blocked herdr-core terminal.
    description: >-
      Only the Computer owner's AnotherMe may ask, and only about a terminal
      state (address, turn, status_ms) that the Computer reported as blocked.
      TeamHub posts a question card bound to that terminal state for the owner.
      When the owner answers, TeamHub dispatches the computer_tool herdr_core
      answer call so the Daemon verifies terminal.get (state == "live",
      status.state == "blocked", turn == expected) and delivers either the
      chosen option's keys sequence (terminal.keys) or the chosen/typed text
      (terminal.send with force: true and no "if" field, since herdr-core
      v0.1.21 terminal.send rejects if="blocked") once; the asking Agent then
      hears the answer and whether it was delivered. Asking again about the
      same state returns the same card.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/herdr-core.yaml#/components/schemas/AgentHerdrCoreAskRequest"
    responses:
      "200":
        description: The question card, new or the one already asked for this terminal state.
        content:
          application/json:
            schema:
              $ref: "../components/herdr-core.yaml#/components/schemas/AgentHerdrCoreAskResponse"
      "400":
        $ref: "../components/agent-api-errors.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/agent-api-errors.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../components/agent-api-errors.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../components/agent-api-errors.yaml#/components/responses/Conflict"
      "503":
        $ref: "../components/agent-api-errors.yaml#/components/responses/ServiceUnavailable"
      default:
        $ref: "../components/agent-api-errors.yaml#/components/responses/InternalError"

call:
  post:
    operationId: callAgentHerdrCore
    tags: [Agent Business API]
    security: [{ agentBearer: [] }]
    summary: Invoke one structured herdr-core tool on this Agent's placed Local Computer.
    description: >-
      Authorizes the Agent against its placed Local Computer and dispatches one
      allowlisted herdr_core computer_tool call through Node Services. Optional
      operation_id deduplicates repeated submissions with the same request
      payload.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/herdr-core.yaml#/components/schemas/AgentHerdrCoreCallRequest"
    responses:
      "200":
        description: Tool result returned by herdr-core on the Computer.
        content:
          application/json:
            schema:
              $ref: "../components/herdr-core.yaml#/components/schemas/AgentHerdrCoreCallResponse"
      "400":
        $ref: "../components/agent-api-errors.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../components/agent-api-errors.yaml#/components/responses/Unauthenticated"
      "403":
        $ref: "../components/agent-api-errors.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../components/agent-api-errors.yaml#/components/responses/Conflict"
      "503":
        $ref: "../components/agent-api-errors.yaml#/components/responses/ServiceUnavailable"
      default:
        $ref: "../components/agent-api-errors.yaml#/components/responses/InternalError"
